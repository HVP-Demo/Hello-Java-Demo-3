# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Black Duck security scan

on:
  push:
    branches: [ main, master, develop, stage, release ]
  pull_request:
    branches: [ main, master, develop, stage, release ]
  workflow_dispatch:

jobs:
  polaris:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write
      actions: read

    steps:
    
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Java JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: temurin
        cache: maven
    
    - name: Polaris Scan
      uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
      with:
        ### SCANNING: Required fields
        polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        polaris_assessment_types: SAST,SCA

        ### SCANNING OPTIONAL
        polaris_application_name: HVP-Demo-1
        polaris_project_name: ${{ github.event.repository.name }}

        ### SCANNING OPTIONAL: Pull Request comments
        polaris_prComment_enabled: true

        ### SCANNING OPTIONAL: GitHub Issues
        polaris_externalIssues_create: true

        ### SCANNING OPTIONAL: Fix Pull Requests
        polaris_fixpr_enabled: true

        ### GITHUB Token
        # Required when Pull Request comments, Fix Pull Requests or GitHub issues are enabled
        github_token: ${{ secrets.GITHUB_TOKEN }}

        ### ENABLE OPTIONAL SCAN REPORTS
        polaris_reports_sarif_create: true
        polaris_upload_sarif_report: true
        
        ### COVERITY BUILD COMMANDS (uncomment and configure for compiled languages)
        coverity_build_command: mvn -B -DskipTests package
        coverity_clean_command: mvn -B clean
        
        ### OPTIONAL DIAGNOSTICS: Upload logs as build artifact if true
        include_diagnostics: false
